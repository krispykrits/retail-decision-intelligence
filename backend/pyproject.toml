[project]
name = "retail-decision-intelligence-api"
version = "0.1.0"
description = "Retail Decision Intelligence HTTP API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.163.1",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "sqlalchemy==2.1.8",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling==1.30.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_api"]

[tool.pytest.ini_options]
testpaths = ["../tests/backend"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.5",
]

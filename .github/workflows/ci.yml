name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history for secrets
        run: |
          # Pin and verify the scanner; redact findings so credentials never enter CI logs.
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check --status
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner --log-opts=--all .
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install uv
        run: python -m pip install uv==0.13.6
      - name: Check contracts, lint, types, tests, build, and local integration
        run: make smoke
      - name: Report Python dependency advisories
        continue-on-error: true
        run: |
          # Report package advisories without blocking development releases.
          uv export --project backend --locked --no-dev --no-emit-project \
            --output-file /tmp/rdi-requirements.txt > /dev/null
          uvx pip-audit==2.10.1 --requirement /tmp/rdi-requirements.txt --no-deps --disable-pip --strict
      - name: Report frontend dependency advisories
        continue-on-error: true
        run: npm audit --prefix frontend --audit-level=high

  infrastructure:
    uses: ./.github/workflows/infrastructure.yml

  container:
    needs: check
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml

  gate:
    name: CI gate
    if: always()
    needs: [check, infrastructure, container]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: test "$RESULTS" = 'success success success'

  development:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [gate, container]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      image: ${{ needs.container.outputs.image }}

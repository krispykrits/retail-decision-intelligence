name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install uv
        run: python -m pip install uv==0.13.6
      - name: Check contracts, lint, types, tests, build, and local integration
        run: make smoke
      - name: Audit dependencies
        run: |
          # Audit the locked Python dependencies and the installed npm dependency tree.
          uv export --project backend --locked --no-dev --no-emit-project \
            --output-file /tmp/rdi-requirements.txt > /dev/null
          uvx pip-audit==2.10.1 --requirement /tmp/rdi-requirements.txt --no-deps --disable-pip --strict
          npm audit --prefix frontend --audit-level=high

  infrastructure:
    uses: ./.github/workflows/infrastructure.yml

  container:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml

  gate:
    name: CI gate
    if: always()
    needs: [check, infrastructure, container]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: test "$RESULTS" = 'success success success'

  development:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [gate, container]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      image: ${{ needs.container.outputs.image }}
